name: One-time PDF download direto

on:
  push:
    paths:
      - .github/workflows/one-time-pdf-download.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Executa ajuste de download PDF'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ajustar botão PDF para download direto
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/_authenticated/calculos.tsx')
          t = p.read_text(encoding='utf-8')
          t = t.replace('  exportarCalculoExcel,\n  exportarCalculoPdf,\n', '  exportarCalculoExcel,\n')
          anchor = 'import { exibir, formatarCNJ, listarProcessos, type Processo } from "@/lib/processos";\n'
          if 'from "@/lib/pdf-calculo"' not in t:
              t = t.replace(anchor, 'import { exportarCalculoPdfDireto } from "@/lib/pdf-calculo";\n' + anchor)
          t = t.replace('  const [excluindo, setExcluindo] = useState(false);', '  const [excluindo, setExcluindo] = useState(false);\n  const [gerandoPdf, setGerandoPdf] = useState(false);')
          antigo = '''  const exportarPdf = () => {
            if (!resultado) return;
            try {
              exportarCalculoPdf(nome, dataBase, criteriosParaSalvar(), resultado, identificacaoAtual);
            } catch (e) {
              toast.error(e instanceof Error ? e.message : "Não consegui gerar o PDF.");
            }
          };'''
          novo = '''  const exportarPdf = async () => {
            if (!resultado) return;
            setGerandoPdf(true);
            try {
              await exportarCalculoPdfDireto(nome, dataBase, criteriosParaSalvar(), resultado, identificacaoAtual);
              toast.success("PDF baixado.");
            } catch (e) {
              toast.error(e instanceof Error ? e.message : "Não consegui gerar o PDF.");
            } finally {
              setGerandoPdf(false);
            }
          };'''
          if antigo not in t:
              raise SystemExit('Bloco exportarPdf esperado não encontrado')
          t = t.replace(antigo, novo)
          antigo_btn = '<Button variant="outline" disabled={!resultado} onClick={exportarPdf}><FileText className="size-4" /> PDF</Button>'
          novo_btn = '<Button variant="outline" disabled={!resultado || gerandoPdf} onClick={() => void exportarPdf()}><FileText className="size-4" /> {gerandoPdf ? "Gerando PDF..." : "PDF"}</Button>'
          if antigo_btn not in t:
              raise SystemExit('Botão PDF esperado não encontrado')
          t = t.replace(antigo_btn, novo_btn)
          p.write_text(t, encoding='utf-8')
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Commit
        run: |
          git config user.name "FaroLex Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/_authenticated/calculos.tsx src/routeTree.gen.ts
          git commit -m "Baixa PDF da calculadora diretamente" || exit 0
          git push
# disparo