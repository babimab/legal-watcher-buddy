name: One-time baixas cliente

on:
  push:
    paths:
      - .github/workflows/one-time-baixas-cliente.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.event.head_commit.message == 'Run baixas cliente patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch menu
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/_authenticated/route.tsx')
          t = p.read_text(encoding='utf-8')
          t = t.replace('  Archive,\n', '  Archive,\n  ClipboardCheck,\n', 1)
          t = t.replace('import { GuiaRapido } from "@/components/GuiaRapido";\n', 'import { GuiaRapido } from "@/components/GuiaRapido";\nimport { listarBaixasCliente } from "@/lib/baixas-cliente";\n', 1)
          t = t.replace('  const pendencias = useQuery({ queryKey: ["pendencias"], queryFn: listarPendencias });\n', '  const pendencias = useQuery({ queryKey: ["pendencias"], queryFn: listarPendencias });\n  const baixasCliente = useQuery({ queryKey: ["baixas-cliente"], queryFn: listarBaixasCliente });\n', 1)
          t = t.replace('  const meusPrazosUrgentes = (pendencias.data ?? []).filter(\n', '  const baixasAbertas = (baixasCliente.data ?? []).filter((b) => b.status !== "encerrado").length;\n  const meusPrazosUrgentes = (pendencias.data ?? []).filter(\n', 1)
          marker = '''            {ehEstagiaria ? null : (\n              <NavItem\n                to="/relatorio"\n                icon={<Archive className="size-4" />}\n                label="Encerramento Astro"\n                search={{ aba: "encerramento-astro" }}\n                tourId="nav-encerramento-astro"\n              />\n            )}\n'''
          insert = marker + '''            {ehEstagiaria ? null : (\n              <NavItem\n                to="/baixas-cliente"\n                icon={<ClipboardCheck className="size-4" />}\n                label="Baixas no cliente"\n                contador={baixasAbertas}\n                tourId="nav-baixas-cliente"\n              />\n            )}\n'''
          if marker not in t:
              raise SystemExit('marker encerramento astro not found')
          t = t.replace(marker, insert, 1)
          p.write_text(t, encoding='utf-8')
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Commit generated integration
        run: |
          git config user.name "FaroLex Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/_authenticated/route.tsx src/routeTree.gen.ts || true
          if ! git diff --cached --quiet; then
            git commit -m "Integra baixas no cliente ao menu"
            git push
          fi
