name: One-time novidades import exclusion

on:
  push:
    paths:
      - .github/workflows/one-time-novidades-planilha.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run novelty import exclusion patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exclude imported spreadsheet history from Novidades only
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/routes/_authenticated/relatorio.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''  const novidadesFiltradas = aplicarFiltrosRelatorio(novidades.data ?? []);\n  const semanaFiltrada = aplicarFiltrosRelatorio(semana.data ?? []);'''
          new = '''  // Importações de planilhas são histórico e não devem aparecer como novidade.\n  // Movimentações manuais e de publicações continuam entrando normalmente.\n  const novidadesSemImportacao = (novidades.data ?? []).filter((m) => m.fonte !== "planilha");\n  const novidadesFiltradas = aplicarFiltrosRelatorio(novidadesSemImportacao);\n  const semanaFiltrada = aplicarFiltrosRelatorio(semana.data ?? []);'''
          if text.count(old) != 1:
              raise SystemExit('Trecho de novidades não encontrado exatamente uma vez; abortando sem alterar.')
          text = text.replace(old, new, 1)

          old_count = '      total_movimentacoes: novidades.data?.length ?? 0,'
          new_count = '      total_movimentacoes: novidadesSemImportacao.length,'
          if text.count(old_count) != 1:
              raise SystemExit('Contador da verificação não encontrado exatamente uma vez; abortando.')
          text = text.replace(old_count, new_count, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit approved change
        run: |
          git config user.name "FaroLex automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/_authenticated/relatorio.tsx
          git diff --cached --check
          git commit -m "Oculta importacoes historicas das novidades"
          git push

# trigger
