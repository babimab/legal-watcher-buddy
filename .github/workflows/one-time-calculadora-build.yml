name: One-time calculadora build

on:
  push:
    paths:
      - .github/workflows/one-time-calculadora-build.yml

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Run calculadora build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Commit generated route tree
        run: |
          git config user.name "FaroLex Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git commit -m "Regenera rota da calculadora"
            git push
          fi
