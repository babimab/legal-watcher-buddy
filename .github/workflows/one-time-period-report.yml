name: One-time period report patch

on:
  push:
    paths:
      - .github/workflows/one-time-period-report.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run period report patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add period report
        shell: python
        run: |
          from pathlib import Path

          processos = Path('src/lib/processos.ts')
          text = processos.read_text(encoding='utf-8')

          anchor = '''export async function listarUltimasMovimentacoes(): Promise<Map<string, Movimentacao>> {'''
          if text.count(anchor) != 1:
              raise SystemExit('Anchor listarUltimasMovimentacoes not found exactly once')

          nova_funcao = '''export async function listarMovimentacoesPorPeriodo(\n  de: string,\n  ate: string,\n): Promise<MovimentacaoComProcesso[]> {\n  const { data, error } = await supabase\n    .from("movimentacoes")\n    .select(`*, processos(${CAMPOS_PROCESSO_RELATORIO})`)\n    .gte("data_movimentacao", de)\n    .lte("data_movimentacao", ate)\n    .order("data_movimentacao", { ascending: false })\n    .order("created_at", { ascending: false });\n  if (error) throw error;\n  return (data ?? []) as unknown as MovimentacaoComProcesso[];\n}\n\n'''
          text = text.replace(anchor, nova_funcao + anchor, 1)
          processos.write_text(text, encoding='utf-8')

          relatorio = Path('src/routes/_authenticated/relatorio.tsx')
          text = relatorio.read_text(encoding='utf-8')

          old = '''  listarMovimentacoesPorData,\n  listarPendencias,'''
          new = '''  listarMovimentacoesPorData,\n  listarMovimentacoesPorPeriodo,\n  listarPendencias,'''
          if text.count(old) != 1:
              raise SystemExit('Import anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''  ultimos: "ultimos-andamentos",\n  pendencias: "prazos-pendentes",'''
          new = '''  ultimos: "ultimos-andamentos",\n  periodo: "andamentos-do-periodo",\n  pendencias: "prazos-pendentes",'''
          if text.count(old) != 1:
              raise SystemExit('Filename map anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''  ultimos: `Últimos ${LIMITE_ULTIMOS_ANDAMENTOS} andamentos`,\n  pendencias: "Prazos pendentes",'''
          new = '''  ultimos: `Últimos ${LIMITE_ULTIMOS_ANDAMENTOS} andamentos`,\n  periodo: "Andamentos do período",\n  pendencias: "Prazos pendentes",'''
          if text.count(old) != 1:
              raise SystemExit('Title map anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''  const [rodando, setRodando] = useState(false);\n  const [aba, setAba] = useState(search.aba ?? "novidades");'''
          new = '''  const [rodando, setRodando] = useState(false);\n  const [aba, setAba] = useState(search.aba ?? "novidades");\n  const [periodoDe, setPeriodoDe] = useState("");\n  const [periodoAte, setPeriodoAte] = useState("");\n  const periodoValido = !!periodoDe && !!periodoAte && periodoDe <= periodoAte;'''
          if text.count(old) != 1:
              raise SystemExit('State anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''  const mes = useQuery({\n    queryKey: ["mes"],\n    queryFn: () => listarMovimentacoesPorData(new Date(Date.now() - 30 * 864e5).toISOString()),\n  });\n\n  // Aqui a ordem é pela data real da movimentação; created_at serve só'''
          new = '''  const mes = useQuery({\n    queryKey: ["mes"],\n    queryFn: () => listarMovimentacoesPorData(new Date(Date.now() - 30 * 864e5).toISOString()),\n  });\n\n  const periodo = useQuery({\n    queryKey: ["periodo", periodoDe, periodoAte],\n    queryFn: () => listarMovimentacoesPorPeriodo(periodoDe, periodoAte),\n    enabled: periodoValido,\n  });\n\n  // Aqui a ordem é pela data real da movimentação; created_at serve só'''
          if text.count(old) != 1:
              raise SystemExit('Period query anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''      ...(mes.data ?? []),\n      ...(ultimos.data ?? []),'''
          new = '''      ...(mes.data ?? []),\n      ...(periodo.data ?? []),\n      ...(ultimos.data ?? []),'''
          if text.count(old) != 1:
              raise SystemExit('Advogado values anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''  }, [novidades.data, semana.data, mes.data, ultimos.data, pendencias.data, minhaSigla]);'''
          new = '''  }, [novidades.data, semana.data, mes.data, periodo.data, ultimos.data, pendencias.data, minhaSigla]);'''
          if text.count(old) != 1:
              raise SystemExit('Advogado dependency anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''  const mesFiltrado = aplicarFiltrosRelatorio(mes.data ?? []);\n  const ultimosFiltrados = aplicarFiltrosRelatorio(ultimos.data ?? []);'''
          new = '''  const mesFiltrado = aplicarFiltrosRelatorio(mes.data ?? []);\n  const periodoFiltrado = aplicarFiltrosRelatorio(periodo.data ?? []);\n  const ultimosFiltrados = aplicarFiltrosRelatorio(ultimos.data ?? []);'''
          if text.count(old) != 1:
              raise SystemExit('Filtered period anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''      : aba === "mes"\n        ? mesFiltrado\n        : aba === "ultimos"'''
          new = '''      : aba === "mes"\n        ? mesFiltrado\n        : aba === "periodo"\n          ? periodoFiltrado\n          : aba === "ultimos"'''
          if text.count(old) != 1:
              raise SystemExit('itensDaAba anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''  const [emails, setEmails] = useState("");\n\n  const abrirEmail = async () => {'''
          new = '''  const [emails, setEmails] = useState("");\n\n  const tituloDaAba =\n    aba === "periodo" && periodoValido\n      ? `Andamentos de ${new Date(`${periodoDe}T12:00:00`).toLocaleDateString("pt-BR")} a ${new Date(`${periodoAte}T12:00:00`).toLocaleDateString("pt-BR")}`\n      : TITULO_POR_ABA[aba]!;\n  const nomeArquivoDaAba =\n    aba === "periodo" && periodoValido\n      ? `andamentos-${periodoDe}-a-${periodoAte}`\n      : NOME_ARQUIVO_POR_ABA[aba]!;\n\n  const abrirEmail = async () => {'''
          if text.count(old) != 1:
              raise SystemExit('Email state anchor not found exactly once')
          text = text.replace(old, new, 1)

          text = text.replace('await exportarAndamentosExcel(itensDaAba, NOME_ARQUIVO_POR_ABA[aba]!).catch(() => {', 'await exportarAndamentosExcel(itensDaAba, nomeArquivoDaAba).catch(() => {', 1)
          text = text.replace('      TITULO_POR_ABA[aba]!,', '      tituloDaAba,', 1)
          text = text.replace('void exportarAndamentosExcel(itensDaAba, NOME_ARQUIVO_POR_ABA[aba]!).catch(() =>', 'void exportarAndamentosExcel(itensDaAba, nomeArquivoDaAba).catch(() =>', 1)

          old = '''          <Tabs value={aba} onValueChange={setAba}>\n            <TabsList>'''
          new = '''          {aba === "periodo" ? (\n            <div className="flex flex-wrap items-end gap-3 rounded-lg border bg-card p-4">\n              <label className="space-y-1 text-sm">\n                <span className="font-medium">De</span>\n                <Input\n                  type="date"\n                  value={periodoDe}\n                  onChange={(e) => setPeriodoDe(e.target.value)}\n                  className="w-44"\n                />\n              </label>\n              <label className="space-y-1 text-sm">\n                <span className="font-medium">Até</span>\n                <Input\n                  type="date"\n                  value={periodoAte}\n                  onChange={(e) => setPeriodoAte(e.target.value)}\n                  className="w-44"\n                />\n              </label>\n              {periodoDe && periodoAte && periodoDe > periodoAte ? (\n                <span className="pb-2 text-sm text-destructive">A data inicial deve ser anterior ou igual à final.</span>\n              ) : null}\n            </div>\n          ) : null}\n\n          <Tabs value={aba} onValueChange={setAba}>\n            <TabsList>'''
          if text.count(old) != 1:
              raise SystemExit('Tabs anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''              <TabsTrigger value="mes">Mês ({mesFiltrado.length})</TabsTrigger>\n              <TabsTrigger value="ultimos">'''
          new = '''              <TabsTrigger value="mes">Mês ({mesFiltrado.length})</TabsTrigger>\n              <TabsTrigger value="periodo">Período ({periodoFiltrado.length})</TabsTrigger>\n              <TabsTrigger value="ultimos">'''
          if text.count(old) != 1:
              raise SystemExit('Period tab trigger anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''            <TabsContent value="mes" className="mt-4">\n              <Lista itens={mesFiltrado} vazio="Nenhuma movimentação nos últimos 30 dias." />\n            </TabsContent>\n            <TabsContent value="ultimos" className="mt-4">'''
          new = '''            <TabsContent value="mes" className="mt-4">\n              <Lista itens={mesFiltrado} vazio="Nenhuma movimentação nos últimos 30 dias." />\n            </TabsContent>\n            <TabsContent value="periodo" className="mt-4">\n              <Lista\n                itens={periodoFiltrado}\n                vazio={\n                  periodoValido\n                    ? "Nenhuma movimentação encontrada nesse período."\n                    : "Escolha as datas inicial e final para gerar o relatório."\n                }\n              />\n            </TabsContent>\n            <TabsContent value="ultimos" className="mt-4">'''
          if text.count(old) != 1:
              raise SystemExit('Period tab content anchor not found exactly once')
          text = text.replace(old, new, 1)

          relatorio.write_text(text, encoding='utf-8')

      - name: Commit approved change
        run: |
          git config user.name "FaroLex automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/processos.ts src/routes/_authenticated/relatorio.tsx
          git diff --cached --check
          git commit -m "Adiciona relatorio por periodo"
          git push
